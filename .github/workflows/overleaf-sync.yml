# Two-way sync between paper/ and an Overleaf project (Overleaf Git integration).
#
#   GitHub -> Overleaf : every push to main that touches paper/
#   Overleaf -> GitHub : every 3 hours, or now with  Actions -> Overleaf sync -> Run workflow
#
# Setup for each new paper (Settings -> Secrets and variables -> Actions):
#   Variables tab -> OVERLEAF_PROJECT = the Overleaf project URL (https://www.overleaf.com/project/...)
#   Secrets tab   -> OVERLEAF_TOKEN   = an Overleaf Git token (Overleaf: Account Settings -> Git integration)
# Until OVERLEAF_PROJECT is set the job is skipped, so a repository that is not connected costs nothing.
name: Overleaf sync

on:
  push:
    branches: [main]
    paths: ["paper/**", ".github/workflows/overleaf-sync.yml", ".github/scripts/overleaf_sync.sh"]
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      first_sync:
        description: "First sync only (ignored afterwards): auto = Overleaf draft wins over the starter paper, otherwise GitHub"
        type: choice
        options: [auto, github, overleaf]
        default: auto

permissions:
  contents: write

concurrency:
  group: overleaf-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ vars.OVERLEAF_PROJECT != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync paper/ with Overleaf
        env:
          OVERLEAF_PROJECT: ${{ vars.OVERLEAF_PROJECT }}
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
          FIRST_SYNC: ${{ inputs.first_sync || 'auto' }}
        run: bash .github/scripts/overleaf_sync.sh
